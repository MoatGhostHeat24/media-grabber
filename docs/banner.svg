<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1226"/>
      <stop offset="0.55" stop-color="#171b3a"/>
      <stop offset="1" stop-color="#1d2450"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f6d"/>
      <stop offset="0.5" stop-color="#a44bf5"/>
      <stop offset="1" stop-color="#3fa9f5"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd86f"/>
      <stop offset="1" stop-color="#fc6262"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="60" cy="60" r="2"/><circle cx="120" cy="60" r="2"/><circle cx="180" cy="60" r="2"/><circle cx="240" cy="60" r="2"/><circle cx="300" cy="60" r="2"/>
    <circle cx="60" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/><circle cx="240" cy="120" r="2"/><circle cx="300" cy="120" r="2"/>
    <circle cx="60" cy="180" r="2"/><circle cx="120" cy="180" r="2"/><circle cx="180" cy="180" r="2"/><circle cx="240" cy="180" r="2"/><circle cx="300" cy="180" r="2"/>
    <circle cx="980" cy="220" r="2"/><circle cx="1040" cy="220" r="2"/><circle cx="1100" cy="220" r="2"/><circle cx="1160" cy="220" r="2"/><circle cx="1220" cy="220" r="2"/>
    <circle cx="980" cy="260" r="2"/><circle cx="1040" cy="260" r="2"/><circle cx="1100" cy="260" r="2"/><circle cx="1160" cy="260" r="2"/><circle cx="1220" cy="260" r="2"/>
  </g>

  <!-- glowing blobs -->
  <circle cx="1180" cy="60" r="140" fill="#a44bf5" fill-opacity="0.16"/>
  <circle cx="1060" cy="280" r="110" fill="#3fa9f5" fill-opacity="0.14"/>
  <circle cx="120" cy="300" r="90" fill="#ff5f6d" fill-opacity="0.12"/>

  <!-- app icon: play + rounded square -->
  <g filter="url(#soft)">
    <rect x="86" y="98" width="124" height="124" rx="30" fill="url(#accent)"/>
    <path d="M132 130 L172 160 L132 190 Z" fill="#ffffff"/>
    <circle cx="182" cy="130" r="14" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text x="248" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Media</text>
  <text x="425" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="url(#accent2)">Grabber</text>
  <text x="250" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#aab4d4">All-in-one social media downloader — YouTube · Instagram · Facebook · TikTok and more</text>

  <!-- platform chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="250" y="236" width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="304" y="261" text-anchor="middle" fill="#dfe6ff">YouTube</text>

    <rect x="370" y="236" width="112" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="426" y="261" text-anchor="middle" fill="#dfe6ff">Instagram</text>

    <rect x="494" y="236" width="108" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="548" y="261" text-anchor="middle" fill="#dfe6ff">Facebook</text>

    <rect x="614" y="236" width="80" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="654" y="261" text-anchor="middle" fill="#dfe6ff">TikTok</text>

    <rect x="706" y="236" width="104" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="758" y="261" text-anchor="middle" fill="#dfe6ff">X / Twitter</text>

    <rect x="822" y="236" width="84" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="864" y="261" text-anchor="middle" fill="#dfe6ff">+more</text>
  </g>

  <!-- version pill -->
  <rect x="1080" y="30" width="152" height="40" rx="20" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.18"/>
  <text x="1156" y="56" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#c8f7d0">v1.2.0 · Win64</text>
</svg>
